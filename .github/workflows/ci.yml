name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: django_test_user
          POSTGRES_PASSWORD: django_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"
      POSTGRES_DB: django_test_db
      POSTGRES_USER: django_test_user
      POSTGRES_PASSWORD: django_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      STRIPE_API_KEY: "test_stripe_key"
      EMAIL_HOST: "localhost"
      EMAIL_PORT: "25"
      EMAIL_HOST_USER: "test@example.com"
      EMAIL_HOST_PASSWORD: "test_password"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/0"

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary redis

      - name: Install Redis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U django_test_user -d django_test_db; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/10)"
            sleep 3
          done
          echo "PostgreSQL failed to start"
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..10}; do
            if redis-cli -h localhost -p 6379 ping; then
              echo "Redis is ready!"
              exit 0
            fi
            echo "Waiting for Redis... ($i/10)"
            sleep 3
          done
          echo "Redis failed to start"
          exit 1

      - name: Run migrations
        run: python manage.py migrate
        env:
          DATABASE_URL: postgresql://django_test_user:django_test_password@localhost:5432/django_test_db

      - name: Run tests
        run: python manage.py test
        env:
          DATABASE_URL: postgresql://django_test_user:django_test_password@localhost:5432/django_test_db

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/myapp:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/myapp:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Create .env file locally
        run: |
          cat > .env.tmp << 'ENVFILE'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}
          ENVFILE

      - name: Copy project files to server
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude 'venv' \
            --exclude '.env' \
            --exclude '.github' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/

      - name: Copy .env file to server
        run: |
          scp .env.tmp ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/.env
          rm .env.tmp

      - name: Deploy application
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
            
            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Activate virtual environment and install dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Run Django commands
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            
            # Restart application services
            sudo systemctl restart myapp.service || echo "Service myapp.service not found"
            sudo systemctl restart myapp-celery.service || echo "Service myapp-celery.service not found"
            
            # Check status
            sudo systemctl status myapp.service --no-pager || true
          EOF